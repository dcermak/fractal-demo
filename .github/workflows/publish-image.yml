---
name: Test and publish worker image

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.3"
          python-version: "3.14"
      - name: Install frozen development dependencies
        run: uv sync --frozen
      - name: Check Python code and build-context filters
        run: uv run --frozen ruff check src tests scripts
      - name: Run Python integration and numerical tests
        run: uv run --frozen pytest

  image:
    needs: test
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build local runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          platforms: linux/amd64
          load: true
          push: false
          tags: fractal-worker:ci
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Verify default worker entrypoint and installed application
        run: |
          docker run --rm fractal-worker:ci --help
          docker run --rm -i --entrypoint /opt/fractal/.venv/bin/python \
            fractal-worker:ci - < scripts/smoke_image.py
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested image and report its immutable reference
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          image="ghcr.io/${REPOSITORY,,}"
          tag="$image:sha-$COMMIT"
          docker tag fractal-worker:ci "$tag"
          docker push "$tag"
          reference=$(docker image inspect "$tag" \
            --format '{{range .RepoDigests}}{{println .}}{{end}}' | grep -F "$image@sha256:")
          test -n "$reference"
          printf '%s\n' "$reference" > worker-image.txt
          {
            echo '## Worker image'
            echo
            echo "Commit: $COMMIT"
            echo
            echo "Tag: \`$tag\`"
            echo
            echo "Deploy by digest: \`$reference\`"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Save the published reference
        uses: actions/upload-artifact@v4
        with:
          name: worker-image-reference
          path: worker-image.txt
