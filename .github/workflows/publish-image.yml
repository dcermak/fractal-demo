---
name: Test and publish images

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: worker-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        run: |
          PIPX_BIN_DIR="$HOME/.local/bin" pipx install uv
          printf '%s\n' "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Install frozen development dependencies
        run: uv sync --frozen
      - name: Run Python integration and numerical tests
        run: uv run --frozen pytest
      - name: Check generated Helm manifests
        run: |
          helm version --short
          uv run --frozen python -m pytest tests/deploy/chart.py

  image:
    needs: test
    if: >-
      github.event_name != 'pull_request' &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Build worker and gateway images
        env:
          SOURCE: ${{ github.server_url }}/${{ github.repository }}
          COMMIT: ${{ github.sha }}
        run: |
          for role in worker gateway; do
            docker build --platform linux/amd64 --target "$role" \
              -f Containerfile -t "fractal-$role:ci" \
              --label "org.opencontainers.image.source=$SOURCE" \
              --label "org.opencontainers.image.revision=$COMMIT" .
          done
      - name: Check bundled Helm and chart
        run: |
          docker run --rm --entrypoint helm fractal-gateway:ci version --short
          docker run --rm --entrypoint helm fractal-gateway:ci template fractal-demo \
            /opt/fractal/deploy/helm/fractal-demo --namespace fractal-demo \
            --set gatewayUrl=http://192.168.1.1:8081
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish images
        env:
          REPOSITORY: ${{ github.repository }}
          COMMIT: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          for role in worker gateway; do
            image="ghcr.io/${REPOSITORY,,}"
            if [ "$role" = gateway ]; then image="$image-gateway"; fi
            tag="$image:sha-$COMMIT"
            docker tag "fractal-$role:ci" "$tag"
            docker push "$tag"
            reference=$(docker image inspect "$tag" \
              --format '{{range .RepoDigests}}{{println .}}{{end}}' | grep -F "$image@sha256:")
            test -n "$reference"
            printf '%s\n' "$reference" > "$role-image.txt"
            docker tag "fractal-$role:ci" "$image:latest"
          done
          docker push "ghcr.io/${REPOSITORY,,}:latest"
          docker push "ghcr.io/${REPOSITORY,,}-gateway:latest"
      - name: Save the worker reference
        uses: actions/upload-artifact@v7
        with:
          name: worker-image-reference
          path: worker-image.txt
      - name: Save the gateway reference
        uses: actions/upload-artifact@v7
        with:
          name: gateway-image-reference
          path: gateway-image.txt
