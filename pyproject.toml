[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "fractal-demo"
version = "0.1.0"
description = "Distributed Mandelbrot rendering for a Kubernetes conference kiosk"
requires-python = ">=3.14,<3.15"
dependencies = ["aiohttp>=3.13,<4", "numpy>=2.3,<3", "pillow>=12,<13"]

[project.scripts]
fractal-gateway = "fractal_demo.gateway:main"
fractal-worker = "fractal_demo.worker:main"

[dependency-groups]
dev = ["pytest>=9,<10", "ruff>=0.14", "hatchling>=1.27", "playwright>=1.56,<2", "pyyaml>=6,<7"]

[tool.hatch.build.targets.wheel]
packages = ["src/fractal_demo"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["error"]
